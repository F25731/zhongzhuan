<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/assets/yunyi-logo.svg" type="image/svg+xml">
  <title>运行状态 · 云逸</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #ffffff;
      --bg-1: #fafafa;
      --bg-2: #f5f5f5;
      --surface-0: #ffffff;
      --surface-1: #f8f9fa;
      --border: #e5e7eb;
      --border-hover: #d1d5db;
      --text-0: #111827;
      --text-1: #1f2937;
      --text-2: #6b7280;
      --text-3: #9ca3af;
      --accent: #6366f1;
      --accent-2: #4f46e5;
      --accent-light: #eef2ff;
      --green: #059669;
      --green-light: #ecfdf5;
      --orange: #ea580c;
      --amber: #d97706;
      --red: #dc2626;
      --radius-xs: 8px;
      --radius-md: 14px;
      --radius-xl: 24px;
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { min-height: 100%; }
    body {
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-1);
      color: var(--text-1);
      overflow-x: hidden;
      padding: 0 0 80px;
    }

    /* 导航栏 */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner {
      max-width: 1100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-0);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .navbar-brand svg {
      width: 26px;
      height: 26px;
    }
    .navbar-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .navbar-links a {
      text-decoration: none;
      color: var(--text-2);
      font-size: .86rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-xs);
      transition: color .2s, background .2s;
    }
    .navbar-links a:hover {
      color: var(--text-0);
      background: var(--surface-1);
    }
    .navbar-links a.active {
      color: var(--accent);
      background: var(--accent-light);
    }

    /* 主容器 */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 0;
    }

    /* Hero */
    .hero {
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: 36px 40px;
      margin-bottom: 28px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(5,150,105,.22);
      color: var(--green);
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 5px 14px;
      margin-bottom: 14px;
      background: var(--green-light);
    }
    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.85); }
    }
    .hero h1 {
      font-size: clamp(1.7rem, 3.4vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: -.02em;
      font-weight: 800;
      color: var(--text-0);
    }
    .hero .lede {
      margin-top: 12px;
      color: var(--text-2);
      font-size: .98rem;
      line-height: 1.6;
      max-width: 620px;
    }
    .hero .lede b {
      color: var(--text-0);
      font-weight: 600;
    }

    /* 渠道卡片 */
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 32px 0 14px;
      gap: 14px;
      flex-wrap: wrap;
    }
    .section-title h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-0);
      letter-spacing: -.01em;
    }
    .section-title .hint {
      font-size: .82rem;
      color: var(--text-2);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: 24px 28px;
      transition: box-shadow .3s, transform .3s;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-0);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-name small {
      font-size: .7rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface-1);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: .02em;
    }

    .status-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .status-healthy {
      background: var(--green-light);
      color: var(--green);
    }

    .status-degraded {
      background: #fef3c7;
      color: var(--amber);
    }

    .status-down {
      background: #fef2f2;
      color: var(--red);
    }

    .status-idle {
      background: var(--surface-1);
      color: var(--text-3);
    }

    /* 多窗口网格 */
    .windows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .win-cell {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 12px 14px;
      transition: all .2s;
    }

    .win-cell.is-primary {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .win-cell.is-bad {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .win-cell.is-warn {
      background: #fef3c7;
      border-color: #fde68a;
    }

    .win-label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    .win-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-0);
      font-variant-numeric: tabular-nums;
    }

    .win-value .unit {
      font-size: .9rem;
      font-weight: 600;
      color: var(--text-2);
      margin-left: 2px;
    }

    .win-meta {
      font-size: .72rem;
      color: var(--text-3);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* 趋势图 */
    .spark-wrap {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .spark-wrap .label {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--text-2);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .spark {
      width: 100%;
      height: 54px;
      display: block;
    }

    .empty-hint {
      padding: 16px;
      background: var(--surface-1);
      border-radius: var(--radius-xs);
      color: var(--text-2);
      font-size: .85rem;
      text-align: center;
      margin-top: 12px;
    }

    .variance-note {
      font-size: .78rem;
      color: var(--text-2);
      background: var(--surface-1);
      padding: 10px 12px;
      border-radius: var(--radius-xs);
      margin-top: 12px;
      line-height: 1.5;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .cards {
        grid-template-columns: 1fr;
      }
      .windows-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-2);
    }
    .loading::after {
      content: "...";
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: "."; }
      40% { content: ".."; }
      60%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#6366f1"/>
          <path d="M2 17L12 22L22 17" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        云逸
      </a>
      <div class="navbar-links">
        <a href="/">首页</a>
        <a href="/balance">余额查询</a>
        <a href="/status" class="active">运行状态</a>
        <a href="/tutorial">使用教程</a>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="container">
    <!-- Hero -->
    <div class="hero">
      <span class="eyebrow">实时监控</span>
      <h1>服务运行状态</h1>
      <p class="lede">
        实时监控云逸 <b>Claude</b> 和 <b>Codex</b> 渠道的可用性、成功率和响应延迟。
        数据每 30 秒自动刷新，确保您随时了解服务健康状况。
      </p>
    </div>

    <!-- 渠道状态卡片 -->
    <div class="section-title">
      <h2>渠道运行状态</h2>
      <span class="hint">更新于 <b id="updatedAt">—</b></span>
    </div>

    <div id="cards" class="cards">
      <div class="loading">正在加载渠道状态</div>
    </div>

    <div style="text-align: center; margin-top: 20px; color: var(--text-2); font-size: .82rem;">
      数据每 30 秒自动刷新 · 下次刷新：<b id="nextRefresh">—</b>
    </div>
  </div>

  <script>
    const REFRESH_MS = 30000;
    let nextRefreshAt = 0;

    const STATUS_LABEL = { healthy: '运行正常', degraded: '部分波动', down: '暂不可用', idle: '暂无流量' };
    const STATUS_CLASS = { healthy: 'status-healthy', degraded: 'status-degraded', down: 'status-down', idle: 'status-idle' };

    function fmtTime(unix) {
      if (!unix) return '—';
      const d = new Date(unix * 1000);
      const pad = n => String(n).padStart(2, '0');
      return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function fmtMs(v) {
      if (v == null) return '—';
      if (v >= 1000) return (v / 1000).toFixed(2) + ' s';
      return Math.round(v) + ' ms';
    }

    function sparkline(points) {
      if (!points || !points.length) return '';
      const w = 220, h = 54, pad = 4;
      const xs = points.length;
      const success = points.map(p => Math.max(0, Math.min(100, p.rate || 0)));
      const sx = i => pad + (i / (xs - 1 || 1)) * (w - pad * 2);
      const sy = v => h - pad - (v / 100) * (h - pad * 2);
      let d = '';
      success.forEach((v, i) => { d += (i === 0 ? 'M' : 'L') + sx(i).toFixed(1) + ',' + sy(v).toFixed(1) + ' '; });
      const area = d + `L${sx(xs - 1).toFixed(1)},${h - pad} L${sx(0).toFixed(1)},${h - pad} Z`;
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6366f1" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${area}" fill="url(#sg)"/>
        <path d="${d}" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    }

    const WINDOW_LABEL = { 1: '1 分钟', 5: '5 分钟', 30: '30 分钟', 60: '1 小时', 360: '6 小时', 720: '最近 12 小时', 1440: '最近 24 小时', 4320: '最近 3 天', 10080: '最近 7 天' };

    function renderCard(ch) {
      const cls = STATUS_CLASS[ch.status] || 'status-idle';
      const label = STATUS_LABEL[ch.status] || ch.status || '未知';
      const hint = ch.status === 'idle'
        ? '<div class="empty-hint">⏳ 该渠道当前暂无最近一小时的探针样本，状态待重新采样。</div>'
        : '';
      const spark = (ch.trend && ch.trend.length)
        ? `<div class="spark-wrap"><div class="label"><span>近 1 小时成功率</span><span>越高越稳</span></div>${sparkline(ch.trend)}</div>`
        : '';

      // 多窗口
      const wins = (ch.windows && ch.windows.length) ? ch.windows : [{ window: 1, success_rate: ch.success_rate, p50_latency_ms: ch.p50_latency_ms, status: ch.status }];
      const longest = wins.reduce((a, b) => (a && a.window > b.window) ? a : b, wins[0]);
      const longestSr = (longest && longest.success_rate != null) ? Number(longest.success_rate) : null;
      const winsHTML = wins.map((w, i) => {
        const sr = w.success_rate;
        const isIdle = (sr == null) || (sr === 0 && w.status === 'idle');
        const srStr = isIdle ? '—' : Number(sr).toFixed(sr >= 99 ? 1 : 2);
        const lat = w.p50_latency_ms;
        const latStr = (lat == null || (lat === 0 && w.status === 'idle'))
          ? '' : `P50 ${fmtMs(lat)}`;
        let cellCls = 'win-cell';
        if (i === 0) cellCls += ' is-primary';
        if (!isIdle) {
          if (w.status === 'down' || sr < 90) cellCls += ' is-bad';
          else if (w.status === 'degraded' || sr < 99) cellCls += ' is-warn';
        }
        const labelText = WINDOW_LABEL[w.window] || (w.window + ' 分钟');
        return `
          <div class="${cellCls}">
            <div class="win-label">${labelText}${i === 0 ? '<span class="pulse"></span>' : ''}</div>
            <div class="win-value">${srStr}<span class="unit">%</span></div>
            ${latStr ? `<div class="win-meta">${latStr}</div>` : '<div class="win-meta">&nbsp;</div>'}
          </div>`;
      }).join('');

      let varianceNote = '';
      if (longestSr != null && longestSr >= 99) {
        const shortDip = wins.find(w => w !== longest && w.success_rate != null && w.success_rate < longestSr - 3);
        if (shortDip) {
          const lbl = WINDOW_LABEL[shortDip.window] || (shortDip.window + ' 分钟');
          varianceNote = `<div class="variance-note">ⓘ ${lbl}窗口分母小，几次偶发失败就会显著拉低成功率；长窗口受单次波动影响较小。</div>`;
        }
      }

      // 隐藏渠道名称中的"云驿"字样，改为"云逸"
      const displayName = ch.name.replace(/云驿/g, '云逸');

      return `
        <div class="card">
          <div class="card-head">
            <div><div class="card-name">${displayName}</div></div>
            <span class="status-pill ${cls}">${label}</span>
          </div>
          <div class="windows-grid">${winsHTML}</div>
          ${varianceNote}
          ${spark}
          ${hint}
        </div>
      `;
    }

    async function loadStatus() {
      try {
        const r = await fetch('https://yungyi.com/api/yunyi-status', { cache: 'no-store' });
        const data = await r.json();
        if (!data.success) throw new Error(data.error || '获取失败');
        document.getElementById('cards').innerHTML = data.channels.map(renderCard).join('');
        document.getElementById('updatedAt').textContent = fmtTime(data.updated_at);
        nextRefreshAt = Date.now() + REFRESH_MS;
      } catch (e) {
        console.error(e);
        document.getElementById('updatedAt').textContent = '获取失败';
        document.getElementById('cards').innerHTML = '<div class="loading">加载失败，请稍后重试</div>';
      }
    }

    function tickRefresh() {
      if (!nextRefreshAt) {
        document.getElementById('nextRefresh').textContent = '—';
        return;
      }
      const left = Math.max(0, nextRefreshAt - Date.now());
      document.getElementById('nextRefresh').textContent = Math.ceil(left / 1000) + ' 秒';
    }

    loadStatus();
    setInterval(loadStatus, REFRESH_MS);
    setInterval(tickRefresh, 1000);
  </script>
</body>
</html>
