<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay | 运行状态</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: rgba(255,255,255,.95);
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-soft: #eef2ff;
      --green: #10b981;
      --green-soft: #d1fae5;
      --amber: #f59e0b;
      --amber-soft: #fef3c7;
      --red: #ef4444;
      --red-soft: #fee2e2;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .04);
      --shadow: 0 8px 32px rgba(99, 102, 241, .12);
      --shadow-lg: 0 20px 60px rgba(99, 102, 241, .2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at top left, rgba(139, 92, 246, .15), transparent 50%),
        radial-gradient(ellipse at top right, rgba(99, 102, 241, .15), transparent 50%),
        radial-gradient(ellipse at bottom, rgba(6, 182, 212, .1), transparent 50%),
        linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, .08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, .08), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .1);
      transition: all 0.3s ease;
    }

    .topbar:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .2);
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, .4);
      transition: transform 0.3s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    .navlinks { display: flex; gap: 8px; flex-wrap: wrap; }
    .navlinks a {
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .1);
      transition: all 0.3s ease;
    }
    .navlinks a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .15);
      border-color: rgba(255, 255, 255, .2);
      transform: translateY(-2px);
    }
    .navlinks a.active {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), rgba(139, 92, 246, .8));
      border-color: rgba(99, 102, 241, .3);
    }

    .panel {
      padding: 32px;
      margin-bottom: 24px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }

    .panel:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-4px);
    }

    .kicker {
      width: fit-content;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .intro {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    /* 渠道卡片 */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--line);
    }

    .card-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .status-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-healthy {
      background: var(--green-soft);
      color: var(--green);
    }

    .status-degraded {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .status-down {
      background: var(--red-soft);
      color: var(--red);
    }

    .status-idle {
      background: var(--line);
      color: var(--muted);
    }

    /* 多窗口网格 */
    .windows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .win-cell {
      background: var(--line);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px;
      transition: all .2s;
    }

    .win-cell.is-primary {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .win-cell.is-bad {
      background: var(--red-soft);
      border-color: #fca5a5;
    }

    .win-cell.is-warn {
      background: var(--amber-soft);
      border-color: #fcd34d;
    }

    .win-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.85); }
    }

    .win-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .win-value .unit {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 2px;
    }

    .win-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* 趋势图 */
    .spark-wrap {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .spark-wrap .label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .spark {
      width: 100%;
      height: 54px;
      display: block;
    }

    .empty-hint {
      padding: 16px;
      background: var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
    }

    .variance-note {
      font-size: 13px;
      color: var(--muted);
      background: var(--line);
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .update-info {
      text-align: center;
      color: rgba(255, 255, 255, .6);
      font-size: 13px;
      margin-top: 16px;
    }

    .update-info b {
      color: rgba(255, 255, 255, .9);
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .shell { width: calc(100vw - 24px); padding: 20px 0 40px; }
      .topbar { flex-direction: column; align-items: stretch; }
      .navlinks { justify-content: center; }
      .panel { padding: 24px; }
      .cards { grid-template-columns: 1fr; }
      .windows-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand"><span>运行状态</span></div>
      <div class="navlinks">
        <a href="/">首页导入</a>
        <a href="/balance">余额查询</a>
        <a href="/status" class="active">运行状态</a>
        <a href="/tutorial">教程</a>
      </div>
    </div>

    <section class="panel">
      <div class="kicker">Relay · 实时状态与额度</div>
      <h1>查询渠道运行状态</h1>
      <p class="intro">
        实时监控Relay <b>Claude</b> 和 <b>Codex</b> 渠道的可用性、成功率和响应延迟。
        数据每 30 秒自动刷新，确保您随时了解服务健康状况。
      </p>

      <div id="cards" class="cards">
        <div class="loading">正在加载渠道状态...</div>
      </div>

      <div class="update-info">
        更新于 <b id="updatedAt">—</b> · 下次刷新：<b id="nextRefresh">—</b>
      </div>
    </section>
  </main>

  <script>
    const REFRESH_MS = 30000;
    let nextRefreshAt = 0;

    const STATUS_LABEL = { healthy: '运行正常', degraded: '部分波动', down: '暂不可用', idle: '暂无流量' };
    const STATUS_CLASS = { healthy: 'status-healthy', degraded: 'status-degraded', down: 'status-down', idle: 'status-idle' };

    function fmtTime(unix) {
      if (!unix) return '—';
      const d = new Date(unix * 1000);
      const pad = n => String(n).padStart(2, '0');
      return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function fmtMs(v) {
      if (v == null) return '—';
      if (v >= 1000) return (v / 1000).toFixed(2) + ' s';
      return Math.round(v) + ' ms';
    }

    function sparkline(points) {
      if (!points || !points.length) return '';
      const w = 220, h = 54, pad = 4;
      const xs = points.length;
      const success = points.map(p => Math.max(0, Math.min(100, p.rate || 0)));
      const sx = i => pad + (i / (xs - 1 || 1)) * (w - pad * 2);
      const sy = v => h - pad - (v / 100) * (h - pad * 2);
      let d = '';
      success.forEach((v, i) => { d += (i === 0 ? 'M' : 'L') + sx(i).toFixed(1) + ',' + sy(v).toFixed(1) + ' '; });
      const area = d + `L${sx(xs - 1).toFixed(1)},${h - pad} L${sx(0).toFixed(1)},${h - pad} Z`;
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6366f1" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${area}" fill="url(#sg)"/>
        <path d="${d}" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    }

    const WINDOW_LABEL = { 1: '1 分钟', 5: '5 分钟', 30: '30 分钟', 60: '1 小时', 360: '6 小时', 720: '最近 12 小时', 1440: '最近 24 小时', 4320: '最近 3 天', 10080: '最近 7 天' };

    function renderCard(channel) {
      const name = (channel.name || 'unknown').replace(/Relay/g, 'Relay');
      const status = channel.status || 'idle';
      const windows = channel.windows || {};
      const trend = channel.trend || [];

      const primaryWindow = windows[1] || windows[5] || windows[30] || {};
      const rate = primaryWindow.success_rate ?? 0;
      const latency = primaryWindow.avg_latency_ms;
      const requests = primaryWindow.requests ?? 0;

      let cellsHtml = '';
      [1, 5, 30, 60, 360, 720].forEach((min) => {
        const w = windows[min];
        if (!w) return;
        const r = Math.max(0, Math.min(100, w.success_rate || 0));
        const cls = r >= 95 ? 'is-primary' : r >= 80 ? 'is-warn' : 'is-bad';
        const label = WINDOW_LABEL[min] || `${min}分钟`;
        cellsHtml += `
          <div class="win-cell ${cls}">
            <div class="win-label">${label}</div>
            <div class="win-value">${r.toFixed(1)}<span class="unit">%</span></div>
            <div class="win-meta">${w.requests || 0} 次 · ${fmtMs(w.avg_latency_ms)}</div>
          </div>
        `;
      });

      const sparkHtml = trend.length > 0 ? sparkline(trend) : '<div class="empty-hint">暂无趋势数据</div>';

      return `
        <div class="card">
          <div class="card-head">
            <div class="card-name">${name}</div>
            <div class="status-pill ${STATUS_CLASS[status]}">${STATUS_LABEL[status]}</div>
          </div>
          <div class="windows-grid">${cellsHtml}</div>
          <div class="spark-wrap">
            <div class="label"><span>成功率趋势（最近 24 小时）</span><span>${rate.toFixed(1)}%</span></div>
            ${sparkHtml}
          </div>
          <div class="variance-note">
            <strong>说明：</strong>成功率和延迟数据每 30 秒更新一次。不同时间窗口的数据可能存在波动，属于正常现象。
          </div>
        </div>
      `;
    }

    async function loadStatus() {
      try {
        const res = await fetch('https://api.example.com/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const channels = data.channels || [];
        const container = document.getElementById('cards');
        if (channels.length === 0) {
          container.innerHTML = '<div class="loading">暂无渠道数据</div>';
        } else {
          container.innerHTML = channels.map(renderCard).join('');
        }
        document.getElementById('updatedAt').textContent = fmtTime(data.timestamp);
        nextRefreshAt = Date.now() + REFRESH_MS;
      } catch (err) {
        document.getElementById('cards').innerHTML = `<div class="loading">加载失败：${err.message}</div>`;
      }
    }

    function updateCountdown() {
      const remaining = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
      document.getElementById('nextRefresh').textContent = `${remaining} 秒`;
    }

    loadStatus();
    setInterval(loadStatus, REFRESH_MS);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
