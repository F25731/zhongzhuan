<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/assets/yunyi-logo.svg" type="image/svg+xml">
  <title>云逸 | 余额查询</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: rgba(255,255,255,.95);
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-soft: #eef2ff;
      --green: #10b981;
      --green-soft: #d1fae5;
      --amber: #f59e0b;
      --amber-soft: #fef3c7;
      --red: #ef4444;
      --red-soft: #fee2e2;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .04);
      --shadow: 0 8px 32px rgba(99, 102, 241, .12);
      --shadow-lg: 0 20px 60px rgba(99, 102, 241, .2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at top left, rgba(139, 92, 246, .15), transparent 50%),
        radial-gradient(ellipse at top right, rgba(99, 102, 241, .15), transparent 50%),
        radial-gradient(ellipse at bottom, rgba(6, 182, 212, .1), transparent 50%),
        linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, .08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, .08), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .1);
      transition: all 0.3s ease;
    }

    .topbar:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .2);
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, .4);
      transition: transform 0.3s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    .navlinks { display: flex; gap: 8px; flex-wrap: wrap; }
    .navlinks a {
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .1);
      transition: all 0.3s ease;
    }
    .navlinks a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .15);
      border-color: rgba(255, 255, 255, .2);
      transform: translateY(-2px);
    }
    .navlinks a.active {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), rgba(139, 92, 246, .8));
      border-color: rgba(99, 102, 241, .3);
    }

    .panel {
      padding: 32px;
      margin-bottom: 24px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }

    .panel:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-4px);
    }

    .kicker {
      width: fit-content;
      padding: 8px 16px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary-soft), rgba(139, 92, 246, .1));
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(99, 102, 241, .2);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4.5vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 800;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .lead { margin: 16px 0 0; color: var(--muted); line-height: 1.8; font-size: 16px; max-width: 760px; }

    .query {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      margin-top: 24px;
    }

    label { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #1e293b; }
    input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      transition: all 0.3s ease;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, .1); }
    input:hover { border-color: #cbd5e1; }
    button {
      align-self: end;
      height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, .3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, .4);
    }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .status {
      margin-top: 16px;
      padding: 14px 18px;
      border-left: 3px solid var(--primary);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(135deg, rgba(99, 102, 241, .1), rgba(139, 92, 246, .08));
      color: var(--primary-dark);
      font-size: 14px;
      line-height: 1.7;
    }
    .status.error { border-left-color: var(--red); background: linear-gradient(135deg, rgba(239, 68, 68, .1), rgba(220, 38, 38, .08)); color: var(--red); }
    .status.ok { border-left-color: var(--green); background: linear-gradient(135deg, rgba(16, 185, 129, .1), rgba(5, 150, 105, .08)); color: #059669; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    .metric {
      padding: 20px;
      border: 1px solid rgba(99, 102, 241, .15);
      border-radius: 14px;
      background: rgba(255, 255, 255, .5);
      transition: all 0.3s ease;
    }
    .metric:hover {
      background: rgba(255, 255, 255, .7);
      border-color: rgba(99, 102, 241, .25);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, .15);
    }
    .metric span { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
    .metric strong { display: block; margin-top: 10px; font-size: 26px; line-height: 1.1; color: var(--text); }

    .progress {
      height: 12px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(226, 232, 240, .6);
    }
    .bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), var(--primary)); transition: width 0.6s ease; }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px;
      margin-top: 20px;
      color: #334155;
      font-size: 14px;
    }
    .details div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(226, 232, 240, .6); }
    .details span { color: var(--muted); font-weight: 500; }
    .details strong { text-align: right; font-weight: 600; }

    .models {
      margin-top: 24px;
      border: 1px solid rgba(99, 102, 241, .15);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, .5);
    }
    .models h2 {
      margin: 0;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 700;
      border-bottom: 1px solid rgba(226, 232, 240, .6);
      background: rgba(255, 255, 255, .6);
    }
    .model-row {
      display: grid;
      grid-template-columns: minmax(130px, 1.2fr) repeat(3, minmax(90px, 1fr));
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
      font-size: 14px;
    }
    .model-row:last-child { border-bottom: 0; }
    .model-row.head { color: var(--muted); font-size: 13px; font-weight: 800; background: #fbfcfe; }
    .model-name { font-weight: 800; color: var(--text); }
    .empty { padding: 16px; color: var(--muted); font-size: 14px; }

    .hidden { display: none; }

    @media (max-width: 760px) {
      .query, .summary, .details { grid-template-columns: 1fr; }
      .model-row { grid-template-columns: 1fr 1fr; }
      .model-row.head { display: none; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="/static/assets/yunyi-logo.svg" alt="云逸"><span id="brandTitle">云逸余额查询</span></div>
      <div class="navlinks">
        <a href="/">首页导入</a>
        <a href="/balance" class="active">余额查询</a>
        <a href="/status">运行状态</a>
        <a href="/tutorial">教程</a>
      </div>
    </div>

    <section class="panel">
      <div class="kicker" id="heroKicker">云逸 · 卡密状态与额度</div>
      <h1>查询卡密余额和到期时间</h1>
      <p class="lead">输入你的卡密即可查看剩余额度、已用额度、请求次数、Token 用量和到期时间。查询只用于本次请求，不会在本站保存卡密。</p>

      <div class="query">
        <div>
          <label for="apiKey">卡密 / API Key</label>
          <input id="apiKey" autocomplete="off" placeholder="请输入你的卡密">
        </div>
        <button id="queryButton" type="button" onclick="queryBalance()">查询余额</button>
      </div>
      <div class="status" id="status">输入卡密后点击查询，结果会显示在下方。</div>
    </section>

    <section class="panel hidden" id="resultPanel">
      <div class="summary">
        <div class="metric"><span id="remainingLabel">剩余额度</span><strong id="remaining">-</strong></div>
        <div class="metric"><span id="usedLabel">已用额度</span><strong id="used">-</strong></div>
        <div class="metric"><span id="totalLabel">总额度</span><strong id="total">-</strong></div>
        <div class="metric"><span>剩余时间</span><strong id="timeLeft">-</strong></div>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="details">
        <div><span>卡密预览</span><strong id="keyPreview">-</strong></div>
        <div><span>状态</span><strong id="statusText">-</strong></div>
        <div><span>套餐</span><strong id="planName">-</strong></div>
        <div><span>服务类型</span><strong id="serviceType">-</strong></div>
        <div><span>计费类型</span><strong id="billingType">-</strong></div>
        <div><span>每日重置</span><strong id="nextResetAt">-</strong></div>
        <div><span>今日消耗</span><strong id="dailySpent">-</strong></div>
        <div><span>请求次数</span><strong id="requestCount">-</strong></div>
        <div><span>总 Token</span><strong id="totalTokens">-</strong></div>
        <div><span>到期时间</span><strong id="expiresAt">-</strong></div>
      </div>
      <div class="models">
        <h2>近 24 小时模型统计</h2>
        <div class="model-row head"><div>模型</div><div>请求数</div><div>Token</div><div>消耗</div></div>
        <div id="modelRows"><div class="empty">暂无模型用量记录。</div></div>
      </div>
    </section>
  </main>

  <script>
    const defaultSettings = { brandName: '云逸', siteDomain: 'yunyi.hstudy.xyz' };
    let siteSettings = { ...defaultSettings };

    function fmtNumber(value) {
      const number = Number(value || 0);
      return Number.isFinite(number) ? number.toLocaleString('zh-CN') : '-';
    }

    function fmtDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function fmtTimeLeft(seconds) {
      if (seconds === null || seconds === undefined) return '-';
      if (seconds <= 0) return '已到期';
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      if (days > 0) return `${days}天${hours}小时`;
      const minutes = Math.floor((seconds % 3600) / 60);
      return `${hours}小时${minutes}分钟`;
    }

    function setStatus(text, type = '') {
      const node = document.getElementById('status');
      node.textContent = text;
      node.className = `status ${type}`.trim();
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/site-settings');
        const data = await res.json();
        siteSettings = { ...siteSettings, ...(data.settings || {}) };
      } catch {}
      const brand = siteSettings.brandName || defaultSettings.brandName;
      document.title = `${brand} | 余额查询`;
      document.getElementById('brandTitle').textContent = `${brand}余额查询`;
      document.getElementById('heroKicker').textContent = `${brand} · 卡密状态与额度`;
    }

    async function queryBalance() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const button = document.getElementById('queryButton');
      if (!apiKey) {
        setStatus('请先输入卡密。', 'error');
        return;
      }
      button.disabled = true;
      setStatus('正在查询余额...');
      try {
        const res = await fetch('/api/balance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 502) {
            throw new Error('上游查询繁忙，请稍后重试。');
          }
          throw new Error(data.detail || `HTTP ${res.status}`);
        }
        renderBalance(data.balance || {}, data.modelTrends || {}, data.usageHistory || {});
        setStatus('查询成功。', 'ok');
      } catch (err) {
        document.getElementById('resultPanel').classList.add('hidden');
        setStatus(`查询失败：${err.message}`, 'error');
      } finally {
        button.disabled = false;
      }
    }

    function renderBalance(data, modelTrends, usageHistory) {
      const quota = data.quota || {};
      const usage = data.usage || {};
      const timestamps = data.timestamps || {};
      const isDuration = data.billingType === 'duration' || quota.type === 'duration';
      document.getElementById('remainingLabel').textContent = isDuration ? '今日剩余' : '剩余额度';
      document.getElementById('usedLabel').textContent = isDuration ? '今日已用' : '已用额度';
      document.getElementById('totalLabel').textContent = isDuration ? '每日额度' : '总额度';
      document.getElementById('remaining').textContent = fmtNumber(quota.remaining);
      document.getElementById('used').textContent = fmtNumber(quota.used);
      document.getElementById('total').textContent = fmtNumber(quota.total);
      document.getElementById('timeLeft').textContent = fmtTimeLeft(timestamps.remainingSeconds);
      document.getElementById('bar').style.width = `${Math.max(0, Math.min(100, Number(quota.usedPercent || 0)))}%`;
      document.getElementById('keyPreview').textContent = data.keyPreview || '-';
      document.getElementById('statusText').textContent = data.status || '-';
      document.getElementById('planName').textContent = data.planName || '-';
      document.getElementById('serviceType').textContent = data.serviceType || '-';
      document.getElementById('billingType').textContent = isDuration ? '每日额度' : '总额度';
      document.getElementById('nextResetAt').textContent = fmtDate(quota.nextResetAt);
      document.getElementById('dailySpent').textContent = fmtNumber(usage.dailySpent);
      const historyTotals = (usageHistory && usageHistory.totals) || {};
      document.getElementById('requestCount').textContent = fmtNumber(historyTotals.requests ?? usage.requestCount);
      document.getElementById('totalTokens').textContent = fmtNumber(historyTotals.totalTokens ?? usage.totalTokens);
      document.getElementById('expiresAt').textContent = fmtDate(timestamps.expiresAt);
      renderModelRows(modelTrends.models || []);
      document.getElementById('resultPanel').classList.remove('hidden');
    }

    function renderModelRows(models) {
      const container = document.getElementById('modelRows');
      if (!models.length) {
        container.innerHTML = '<div class="empty">暂无模型用量记录。</div>';
        return;
      }
      container.innerHTML = models.map((item) => `
        <div class="model-row">
          <div class="model-name">${escapeHtml(item.model || 'unknown')}</div>
          <div>${fmtNumber(item.requests)}</div>
          <div>${fmtNumber(item.totalTokens)}</div>
          <div>${fmtNumber(item.cost)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      }[char]));
    }

    loadSettings();
  </script>
</body>
</html>
