<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>站点后台</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: rgba(255,255,255,.95);
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-soft: #eef2ff;
      --secondary: #8b5cf6;
      --green: #10b981;
      --green-soft: #d1fae5;
      --red: #ef4444;
      --red-soft: #fee2e2;
      --amber: #f59e0b;
      --amber-soft: #fef3c7;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .04);
      --shadow: 0 8px 32px rgba(99, 102, 241, .12);
      --shadow-lg: 0 20px 60px rgba(99, 102, 241, .2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at top left, rgba(139, 92, 246, .15), transparent 50%),
        radial-gradient(ellipse at top right, rgba(99, 102, 241, .15), transparent 50%),
        radial-gradient(ellipse at bottom, rgba(6, 182, 212, .1), transparent 50%),
        linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, .08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, .08), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(99, 102, 241, .4);
    }

    h1, h2, h3, p { margin: 0; }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .2);
    }
    h2 { font-size: 20px; font-weight: 700; }
    h3 { font-size: 16px; font-weight: 600; }

    .muted {
      color: rgba(255, 255, 255, .6);
      font-size: 13px;
      line-height: 1.6;
    }

    .login {
      display: grid;
      grid-template-columns: 200px 240px auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab {
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .8);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab:hover {
      background: rgba(255, 255, 255, .15);
      border-color: rgba(255, 255, 255, .2);
      color: #fff;
    }

    .tab.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, .3);
    }
    .panel {
      display: none;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 20px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      padding: 28px;
      transition: all 0.3s ease;
    }

    .panel.active { display: block; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat, .card {
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 16px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(10px);
      padding: 20px;
      transition: all 0.3s ease;
    }

    .stat:hover, .card:hover {
      background: rgba(255, 255, 255, .18);
      border-color: rgba(255, 255, 255, .25);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(99, 102, 241, .2);
    }

    .stat span {
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
      font-weight: 600;
    }

    .stat strong {
      display: block;
      margin-top: 10px;
      font-size: 20px;
      word-break: break-all;
      color: #fff;
    }

    .card h2 {
      color: #fff;
      margin-bottom: 12px;
    }

    .card .muted {
      color: rgba(255, 255, 255, .7);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: rgba(255, 255, 255, .9);
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      border: 2px solid rgba(255, 255, 255, .2);
      border-radius: 12px;
      background: rgba(255, 255, 255, .15);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 14px;
      outline: none;
      font: inherit;
      transition: all 0.3s ease;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, .5);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.7;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, .2);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .2);
    }

    input:hover, textarea:hover, select:hover {
      border-color: rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .18);
    }

    button, .button-link {
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, .3);
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, .4);
    }

    .secondary {
      background: rgba(255, 255, 255, .12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .2);
    }

    .secondary:hover {
      background: rgba(255, 255, 255, .18);
      border-color: rgba(255, 255, 255, .3);
    }

    .danger {
      background: rgba(239, 68, 68, .2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, .3);
    }

    .danger:hover {
      background: rgba(239, 68, 68, .3);
      border-color: rgba(239, 68, 68, .4);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .status {
      margin-top: 18px;
      padding: 14px 18px;
      border-left: 3px solid var(--primary);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(135deg, rgba(99, 102, 241, .15), rgba(139, 92, 246, .1));
      backdrop-filter: blur(10px);
      color: #c7d2fe;
      font-size: 13px;
      line-height: 1.7;
      min-height: 46px;
    }

    .status.ok {
      border-left-color: var(--green);
      background: linear-gradient(135deg, rgba(16, 185, 129, .15), rgba(5, 150, 105, .1));
      color: #86efac;
    }

    .status.error {
      border-left-color: var(--red);
      background: linear-gradient(135deg, rgba(239, 68, 68, .15), rgba(220, 38, 38, .1));
      color: #fca5a5;
    }

    .status.warn {
      border-left-color: var(--amber);
      background: linear-gradient(135deg, rgba(245, 158, 11, .15), rgba(251, 191, 36, .1));
      color: #fcd34d;
    }

    .package-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 110px 150px 170px;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .package-row:last-child { border-bottom: 0; }
    .package-name { word-break: break-all; font-weight: 700; color: #fff; }
    #currentPackage { white-space: pre-wrap; color: rgba(255, 255, 255, .8); }

    .badge {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(16, 185, 129, .2), rgba(5, 150, 105, .15));
      color: #86efac;
      border: 1px solid rgba(16, 185, 129, .3);
    }

    .test-result {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: rgba(255, 255, 255, .9);
    }

    @media (max-width: 920px) {
      .login, .grid, .stats, .package-row {
        grid-template-columns: 1fr;
      }
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <div>
          <h1>站点后台</h1>
          <p class="muted">配置站点、导入参数、余额查询接口和 CC-Switch 下载包。</p>
        </div>
      </div>
      <div class="actions">
        <a class="button-link secondary" href="/" target="_blank">首页</a>
        <a class="button-link secondary" href="/balance" target="_blank">余额页</a>
        <a class="button-link secondary" href="/tutorial" target="_blank">教程页</a>
      </div>
    </div>

    <section class="login">
      <input id="adminUser" placeholder="后台用户名" value="fyanxv">
      <input id="adminPass" type="password" placeholder="后台密码">
      <button class="primary" type="button" onclick="loadAll()">登录并加载</button>
    </section>

    <nav class="tabs">
      <button class="tab active" type="button" data-tab="dashboard" onclick="switchTab('dashboard')">概览</button>
      <button class="tab" type="button" data-tab="site" onclick="switchTab('site')">站点基础</button>
      <button class="tab" type="button" data-tab="providers" onclick="switchTab('providers')">导入配置</button>
      <button class="tab" type="button" data-tab="balance" onclick="switchTab('balance')">余额查询</button>
      <button class="tab" type="button" data-tab="downloads" onclick="switchTab('downloads')">下载包</button>
    </nav>

    <section id="panel-dashboard" class="panel active">
      <div class="stats">
        <div class="stat"><span class="muted">品牌</span><strong id="dashBrand">-</strong></div>
        <div class="stat"><span class="muted">站点域名</span><strong id="dashDomain">-</strong></div>
        <div class="stat"><span class="muted">当前下载包</span><strong id="dashPackage">-</strong></div>
        <div class="stat"><span class="muted">最近保存</span><strong id="dashUpdated">-</strong></div>
      </div>
      <div class="grid">
        <div class="card stack">
          <h2>Claude</h2>
          <div class="muted" id="dashClaude">-</div>
        </div>
        <div class="card stack">
          <h2>Codex</h2>
          <div class="muted" id="dashCodex">-</div>
        </div>
      </div>
    </section>

    <section id="panel-site" class="panel">
      <div class="grid">
        <div class="card stack">
          <h2>基础信息</h2>
          <label>品牌名<input id="brandName" placeholder="如：Relay"></label>
          <label>站点域名<input id="siteDomain" placeholder="如：relay.example.com"></label>
          <label>购买卡密地址<input id="buyUrl" placeholder="https://example.com/buy"></label>
        </div>
        <div class="card stack">
          <h2>公告</h2>
          <label>首页公告<textarea id="announcement" placeholder="首页公告内容"></textarea></label>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="button" onclick="saveSettings()">保存配置</button>
      </div>
    </section>

    <section id="panel-providers" class="panel">
      <div class="grid">
        <div class="card stack">
          <h2>Claude</h2>
          <label>显示名称<input id="claudeName" placeholder="如：Claude 通道"></label>
          <label>API 地址<input id="claudeEndpoint" placeholder="https://api.example.com/claude"></label>
          <label>官网链接<input id="claudeHomepage" placeholder="https://api.example.com"></label>
        </div>
        <div class="card stack">
          <h2>Codex</h2>
          <label>显示名称<input id="codexName" placeholder="如：Codex 通道"></label>
          <label>API 地址<input id="codexEndpoint" placeholder="https://api.example.com/codex"></label>
          <label>官网链接<input id="codexHomepage" placeholder="https://api.example.com"></label>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="button" onclick="saveSettings()">保存配置</button>
      </div>
    </section>

    <section id="panel-balance" class="panel">
      <div class="grid">
        <div class="card stack">
          <h2>接口配置</h2>
          <label>余额查询接口<input id="balanceApiUrl" placeholder="https://api.example.com/user/api/v1/me?view=dashboard"></label>
          <label>模型统计接口<input id="modelTrendsApiUrl" placeholder="https://api.example.com/user/api/v1/usage/model-trends?period=24h"></label>
          <label>24 小时用量接口<input id="usageHistoryApiUrl" placeholder="https://api.example.com/user/api/v1/usage/history?period=24h"></label>
          <div class="actions">
            <button class="primary" type="button" onclick="saveSettings()">保存配置</button>
          </div>
        </div>
        <div class="card stack">
          <h2>查询测试</h2>
          <label>测试卡密<input id="testApiKey" type="password" placeholder="输入一张卡密测试当前接口"></label>
          <div class="actions">
            <button class="secondary" type="button" onclick="testBalance()">测试余额查询</button>
          </div>
          <div id="testResult" class="test-result">未测试</div>
        </div>
      </div>
    </section>

    <section id="panel-downloads" class="panel">
      <div class="grid">
        <div class="card stack">
          <h2>当前下载</h2>
          <label>下载按钮文案<input id="downloadLabel" placeholder="如：下载 CC-Switch"></label>
          <div class="muted" id="currentPackage">-</div>
          <div class="actions">
            <button class="primary" type="button" onclick="saveSettings()">保存文案</button>
          </div>
        </div>
        <div class="card stack">
          <h2>上传新包</h2>
          <label>适用平台<select id="downloadPlatform">
            <option value="windows">Windows</option>
            <option value="macos">macOS</option>
            <option value="linux">Linux</option>
          </select></label>
          <label>CC-Switch 安装包<input id="downloadFile" type="file"></label>
          <div class="actions">
            <button class="secondary" type="button" onclick="uploadPackage()">上传并启用</button>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:16px;">
        <h2>历史下载包</h2>
        <div id="packageList" class="muted" style="margin-top:10px;">未加载</div>
      </div>
    </section>

    <div class="status" id="status">输入后台用户名和密码后，点击“登录并加载”。</div>
  </main>

  <script>
    let currentSettings = {};
    let currentPackages = [];

    function authHeader() {
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;
      return 'Basic ' + btoa(`${user}:${pass}`);
    }

    async function adminFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', authHeader());
      if (options.body && !(options.body instanceof FormData)) {
        headers.set('Content-Type', 'application/json');
      }
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        const data = await response.json().catch(() => null);
        throw new Error((data && data.detail) || `HTTP ${response.status}`);
      }
      return response.json();
    }

    function setStatus(message, type = '') {
      const status = document.getElementById('status');
      status.className = `status ${type}`.trim();
      status.textContent = message;
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.tab === name);
      });
      document.querySelectorAll('.panel').forEach((panel) => {
        panel.classList.toggle('active', panel.id === `panel-${name}`);
      });
    }

    function fmtBytes(bytes) {
      const value = Number(bytes || 0);
      if (value >= 1024 * 1024) return `${(value / 1024 / 1024).toFixed(1)} MB`;
      if (value >= 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${value} B`;
    }

    function platformLabel(platform) {
      return { windows: 'Windows', macos: 'macOS', linux: 'Linux' }[platform] || platform;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function validateUrlField(id, label, requireHttps = false) {
      const value = document.getElementById(id).value.trim();
      if (!value) return value;
      let parsed;
      try {
        parsed = new URL(value);
      } catch {
        throw new Error(`${label} 格式不正确`);
      }
      if (requireHttps && parsed.protocol !== 'https:') {
        throw new Error(`${label} 必须使用 https`);
      }
      if (!requireHttps && !['http:', 'https:'].includes(parsed.protocol)) {
        throw new Error(`${label} 必须使用 http 或 https`);
      }
      return value;
    }

    function fill(settings) {
      currentSettings = settings || {};
      document.getElementById('brandName').value = currentSettings.brandName || '';
      document.getElementById('siteDomain').value = currentSettings.siteDomain || '';
      document.getElementById('announcement').value = currentSettings.announcement || '';
      document.getElementById('buyUrl').value = currentSettings.buyUrl || '';
      document.getElementById('balanceApiUrl').value = currentSettings.balanceApiUrl || '';
      document.getElementById('modelTrendsApiUrl').value = currentSettings.modelTrendsApiUrl || '';
      document.getElementById('usageHistoryApiUrl').value = currentSettings.usageHistoryApiUrl || '';
      document.getElementById('downloadLabel').value = currentSettings.downloadLabel || '';
      document.getElementById('claudeName').value = currentSettings.claudeName || '';
      document.getElementById('claudeEndpoint').value = currentSettings.claudeEndpoint || '';
      document.getElementById('claudeHomepage').value = currentSettings.claudeHomepage || '';
      document.getElementById('codexName').value = currentSettings.codexName || '';
      document.getElementById('codexEndpoint').value = currentSettings.codexEndpoint || '';
      document.getElementById('codexHomepage').value = currentSettings.codexHomepage || '';
      renderDashboard();
    }

    function renderDashboard() {
      const packs = currentSettings.downloadPackages || {};
      const pack = packs.windows || currentSettings.downloadPackage || {};
      document.getElementById('dashBrand').textContent = currentSettings.brandName || '-';
      document.getElementById('dashDomain').textContent = currentSettings.siteDomain || '-';
      document.getElementById('dashPackage').textContent = ['windows', 'macos', 'linux'].filter((platform) => packs[platform]).map(platformLabel).join(' / ') || '-';
      document.getElementById('dashUpdated').textContent = currentSettings.updatedAt || '-';
      document.getElementById('dashClaude').textContent = `${currentSettings.claudeName || '-'}\n${currentSettings.claudeEndpoint || '-'}`;
      document.getElementById('dashCodex').textContent = `${currentSettings.codexName || '-'}\n${currentSettings.codexEndpoint || '-'}`;
      const activeRows = ['windows', 'macos', 'linux']
        .filter((platform) => packs[platform])
        .map((platform) => {
          const item = packs[platform];
          return `${platformLabel(platform)}：${item.originalName || item.filename}，${fmtBytes(item.sizeBytes)}，上传于 ${item.uploadedAt}`;
        });
      document.getElementById('currentPackage').textContent = activeRows.length
        ? activeRows.join('\n')
        : (pack.originalName || currentSettings.downloadFilename || '暂未记录下载包');
    }

    function renderPackages(items) {
      currentPackages = items || [];
      const list = document.getElementById('packageList');
      if (!currentPackages.length) {
        list.textContent = '暂无下载包记录。';
        return;
      }
      list.innerHTML = currentPackages.map((item) => `
        <div class="package-row">
          <div>
            <div class="package-name">${platformLabel(item.platform)} · ${escapeHtml(item.originalName || item.filename)}</div>
            <div class="muted">${escapeHtml(item.filename)}${item.active ? ' <span class="badge">当前使用</span>' : ''}</div>
          </div>
          <div>${fmtBytes(item.sizeBytes)}</div>
          <div>${item.uploadedAt || '-'}</div>
          <div class="actions" style="margin:0;">
            ${item.active ? '' : `<button class="secondary" type="button" onclick="activatePackage(${item.id})">启用</button>`}
            ${item.active ? '' : `<button class="danger" type="button" onclick="deletePackage(${item.id})">删除</button>`}
          </div>
        </div>
      `).join('');
    }

    async function loadAll() {
      setStatus('正在加载后台配置...');
      try {
        const data = await adminFetch('/api/admin/site-settings');
        fill(data.settings || {});
        await loadPackages();
        setStatus('配置已加载。', 'ok');
      } catch (err) {
        setStatus(`加载失败：${err.message}`, 'error');
      }
    }

    async function loadPackages() {
      const data = await adminFetch('/api/admin/download-packages');
      renderPackages(data.items || []);
    }

    async function saveSettings() {
      setStatus('正在保存配置...');
      try {
        const payload = {
          brandName: document.getElementById('brandName').value.trim(),
          siteDomain: document.getElementById('siteDomain').value.trim(),
          announcement: document.getElementById('announcement').value.trim(),
          buyUrl: validateUrlField('buyUrl', '购买地址'),
          balanceApiUrl: validateUrlField('balanceApiUrl', '余额查询接口', true),
          modelTrendsApiUrl: validateUrlField('modelTrendsApiUrl', '模型统计接口', true),
          usageHistoryApiUrl: validateUrlField('usageHistoryApiUrl', '24 小时用量接口', true),
          downloadLabel: document.getElementById('downloadLabel').value.trim(),
          claudeName: document.getElementById('claudeName').value.trim(),
          claudeEndpoint: validateUrlField('claudeEndpoint', 'Claude API 地址', true),
          claudeHomepage: validateUrlField('claudeHomepage', 'Claude 官网链接'),
          codexName: document.getElementById('codexName').value.trim(),
          codexEndpoint: validateUrlField('codexEndpoint', 'Codex API 地址', true),
          codexHomepage: validateUrlField('codexHomepage', 'Codex 官网链接')
        };
        const data = await adminFetch('/api/admin/site-settings', {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
        fill(data.settings || {});
        setStatus('配置已保存。', 'ok');
      } catch (err) {
        setStatus(`保存失败：${err.message}`, 'error');
      }
    }

    async function testBalance() {
      const apiKey = document.getElementById('testApiKey').value.trim();
      const result = document.getElementById('testResult');
      if (!apiKey) {
        result.textContent = '请先输入测试卡密。';
        return;
      }
      result.textContent = '正在测试...';
      try {
        const response = await fetch('/api/balance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }
        const balance = data.balance || {};
        const quota = balance.quota || {};
        result.textContent = [
          '测试成功',
          `套餐：${balance.planName || '-'}`,
          `类型：${balance.billingType || '-'}`,
          `剩余：${quota.remaining ?? '-'}`,
          `总量：${quota.total ?? '-'}`,
          `模型统计：${data.modelTrends && data.modelTrends.models ? '正常' : '无数据'}`,
          `24 小时用量：${data.usageHistory && data.usageHistory.totals ? '正常' : '无数据'}`
        ].join('\n');
      } catch (err) {
        result.textContent = `测试失败：${err.message}`;
      }
    }

    async function uploadPackage() {
      const file = document.getElementById('downloadFile').files[0];
      if (!file) {
        setStatus('请先选择一个安装包文件。', 'warn');
        return;
      }
      setStatus('正在上传安装包...');
      try {
        const form = new FormData();
        form.append('file', file);
        form.append('platform', document.getElementById('downloadPlatform').value);
        const data = await adminFetch('/api/admin/download-package', {
          method: 'POST',
          body: form
        });
        fill(data.settings || {});
        renderPackages(data.packages || []);
        document.getElementById('downloadFile').value = '';
        setStatus('安装包已上传并启用。', 'ok');
      } catch (err) {
        setStatus(`上传失败：${err.message}`, 'error');
      }
    }

    async function activatePackage(id) {
      setStatus('正在切换下载包...');
      try {
        const data = await adminFetch(`/api/admin/download-package/${id}/activate`, { method: 'POST' });
        fill(data.settings || {});
        renderPackages(data.packages || []);
        setStatus('下载包已切换。', 'ok');
      } catch (err) {
        setStatus(`切换失败：${err.message}`, 'error');
      }
    }

    async function deletePackage(id) {
      if (!confirm('确定删除这个历史安装包吗？')) return;
      setStatus('正在删除下载包...');
      try {
        const data = await adminFetch(`/api/admin/download-package/${id}`, { method: 'DELETE' });
        renderPackages(data.items || []);
        setStatus('下载包已删除。', 'ok');
      } catch (err) {
        setStatus(`删除失败：${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
